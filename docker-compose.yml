# TripDusk — VPS runtime (serves the built site with automatic HTTPS)
# The site itself is BUILT by GitHub Actions and rsynced into ./_site.
# This compose only SERVES those files — no build here.
#
# One-time on the VPS:
#   1. Point tripdusk.com + www DNS A records at this server
#   2. Set a real email in the three LETSENCRYPT/DEFAULT lines below
#   3. docker compose up -d
# See SETUP-CMS.md for the full walkthrough.

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped

  acme-companion:
    image: nginxproxy/acme-companion:2.5
    container_name: acme-companion
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: contact@tripdusk.com
    restart: unless-stopped

  tripdusk:
    image: nginx:1.27-alpine
    container_name: tripdusk
    depends_on:
      - nginx-proxy
    volumes:
      - ./_site:/usr/share/nginx/html:ro
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: tripdusk.com,www.tripdusk.com
      LETSENCRYPT_HOST: tripdusk.com,www.tripdusk.com
      LETSENCRYPT_EMAIL: contact@tripdusk.com
    restart: unless-stopped

volumes:
  certs:
  vhost:
  html:
  acme:
