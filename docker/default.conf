# TripDusk static site — served on port 80 inside the container.
# TLS is terminated by the nginx-proxy container in front of this one.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pretty URLs: /about → /about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long cache for static assets (they're versioned by content)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML so updates show immediately
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Correct MIME + short cache for SEO files
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/xml application/manifest+json;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
